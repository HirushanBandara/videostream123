<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Player</title>

  <!-- Fredoka One Font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

  <!-- MediaElement.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mediaelement@4.2.16/build/mediaelementplayer.min.css">

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: 'Fredoka One', cursive;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .player-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    video, iframe {
      width: 100%;
      height: 100%;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }
    .video-title {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1rem;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      z-index: 10;
    }
    .spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid #fff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    .toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      opacity: 0;
      animation: fadeInOut 4s ease forwards;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes fadeInOut {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="player-container">
    <button class="back-btn" onclick="window.location.href='index.html'">Back</button>
    <div class="video-title" id="videoTitle"></div>
    <div class="spinner" id="spinner"></div>
    <div class="toast">Press Esc to go back. Space to play/pause.</div>
    <iframe id="ytPlayer" frameborder="0" allowfullscreen allow="autoplay"></iframe>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('videoId');
    const title = urlParams.get('title');

    document.getElementById('videoTitle').textContent = decodeURIComponent(title);

    const player = document.getElementById('ytPlayer');
    const spinner = document.getElementById('spinner');

    const src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&rel=0&enablejsapi=1`;
    player.src = src;

    player.onload = () => spinner.style.display = 'none';

    window.onload = () => {
      player.requestFullscreen?.() || player.webkitRequestFullscreen?.();
    };

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.location.href = 'index.html';
      } else if (e.key === ' ') {
        e.preventDefault();
        const iframeWindow = player.contentWindow;
        iframeWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      } else if (e.key === 'ArrowDown') {
        const iframeWindow = player.contentWindow;
        iframeWindow.postMessage('{"event":"command","func":"setVolume","args":[0.5]}', '*');
      } else if (e.key === 'ArrowUp') {
        const iframeWindow = player.contentWindow;
        iframeWindow.postMessage('{"event":"command","func":"setVolume","args":[1]}', '*');
      }
    });
  </script>
</body>
</html>
